server {
    listen ${HOST}:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;
    add_header Referrer-Policy "unsafe-url" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BEGIN API PROXY
    # API 代理。前端请求同源 /api-proxy/...，由 Nginx 转发到部署时配置的 API_PROXY_URL。
    location /api-proxy/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        set $allow_proxy 0;
        if ($uri ~* ^/api-proxy/((v1/)?(images/generations|images/edits|responses|tasks/.+))$) {
            set $allow_proxy 1;
        }
        if ($allow_proxy = 0) {
            return 403 "Forbidden: API Proxy path restricted";
        }

        proxy_pass ${API_PROXY_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # 针对媒体文件的代理。请求路径形如 /api-proxy/media/task_xxx
    # 需要提取去掉了末尾 /v1 的基础 API 代理 URL 根，并将请求转发到正确的物理路径上
    location /api-proxy/media/ {
        resolver 127.0.0.11 8.8.8.8 1.1.1.1;

        set $media_proxy_url "";
        # 匹配 ${API_PROXY_URL} 去掉最后的 /v1，例如将 https://api.apimart.ai/v1 转换为 https://dragoncode.codes/gpt-image
        if ("${API_PROXY_URL}" ~* ^(https?://[^/]+(/[^/]+)*)/v1$) {
            set $media_proxy_url $1;
        }

        # 如果没有匹配上，则 fallback 回原值
        if ($media_proxy_url = "") {
            set $media_proxy_url ${API_PROXY_URL};
        }

        # 重写将 /api-proxy/media/ 剥离并替换为真实路径
        rewrite ^/api-proxy/media/(.*)$ /media/$1 break;

        proxy_pass $media_proxy_url;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    # END API PROXY

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
